<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세계 국기 퀴즈</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #4369C6;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<!-- body의 높이를 100dvh로 고정하여 모바일 주소창 버그 원천 차단 -->
<body class="text-slate-800 flex items-center justify-center p-0 sm:p-4 w-full" style="height: 100dvh;">

    <!-- [퀴즈 시작 / 설정 모달창] -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm" style="height: 100dvh;">
        <div class="bg-white w-full max-w-[320px] sm:max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="bg-[#4369C6] p-3 sm:p-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base sm:text-lg">퀴즈 준비</h3>
                <button onclick="location.href='index.html'" class="text-indigo-200 hover:text-white text-2xl font-bold leading-none">&times;</button>
            </div>
            <div class="p-5 sm:p-6">
                <div class="text-center mb-4 sm:mb-5">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-indigo-50 rounded-full flex items-center justify-center text-4xl sm:text-5xl mx-auto mb-2 sm:mb-3 shadow-inner">🌍</div>
                    <h2 class="text-lg sm:text-xl font-extrabold text-slate-800">세계 국기 퀴즈111</h2>
                    <p class="text-slate-500 text-xs sm:text-sm mt-1">총 20문제가 출제ㄴㄴ됩니다.</p>
                </div>

                <label class="bg-slate-50 border border-slate-200 rounded-xl p-3 sm:p-4 mb-5 flex items-center justify-between cursor-pointer select-none" style="-webkit-tap-highlight-color: transparent;">
                    <div class="flex items-center space-x-2">
                        <span class="text-lg sm:text-xl">⏱️</span>
                        <div>
                            <div class="font-bold text-slate-800 text-xs sm:text-sm">타이머 설정</div>
                            <div class="text-[11px] text-slate-500">문제당 제한시간 10초</div>
                        </div>
                    </div>
                    
                    <div class="relative inline-flex items-center">
                        <!-- 아이폰 강제 렌더링 버그 방지를 위해 opacity-0과 absolute 속성 적용 -->
                        <input type="checkbox" id="timer-toggle" class="opacity-0 absolute w-0 h-0 peer" onchange="toggleTimerState(this.checked)">
                        <div class="w-12 h-6 sm:w-14 sm:h-7 bg-slate-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 sm:after:h-6 sm:after:w-6 after:transition-all peer-checked:bg-[#4369C6]"></div>
                    </div>
                </label>

                <button onclick="startQuiz()" class="w-full bg-[#4369c6] hover:bg-violet-600 text-white font-extrabold py-3.5 sm:py-4 rounded-xl transition-all shadow-lg hover:shadow-violet-500/20 active:scale-98 text-base sm:text-lg">
                    게임 시작하기
                </button>
            </div>
        </div>
    </div>

<!-- [게임 화면] -->
    <div id="game-screen" class="hidden w-full flex-col items-center justify-between p-0 m-0" style="height: 100dvh;">
        <div class="w-full h-full bg-[#4369C6] flex flex-col justify-between p-4 sm:p-6 overflow-hidden">
            
            <!-- 상단 바 -->
            <div class="flex justify-between items-center shrink-0">
                <button onclick="location.href='index.html'" class="text-gray-300 hover:text-white font-bold px-2 py-1 rounded-lg hover:bg-white/10 transition-colors text-xs sm:text-sm flex items-center gap-1">
                    ← 메인으로
                </button>
                <div class="flex items-center space-x-2">
                    <div id="timer-badge" class="hidden bg-rose-500/90 text-white px-2.5 py-1 rounded-full font-bold text-xs sm:text-sm shadow-md animate-pulse">
                        ⏱️ <span id="timer-sec">10</span>초
                    </div>
                    <div class="bg-black/30 text-white px-3 sm:px-4 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm shadow-inner border border-white/5">
                        <span id="question-number">문제 1 / 20</span>
                    </div>
                </div>
            </div>

            <!-- 중앙 이미지 영역 (이미지 높이를 살짝 줄여서 여유 공간 확보) -->
            <div class="flex-1 flex flex-col items-center justify-center relative my-auto">
                <div class="absolute inset-0 bg-blue-500/10 blur-3xl rounded-full m-auto w-40 h-40"></div>
                <div class="w-full relative flex items-center justify-center z-10">
                    <img id="quiz-image" src="" alt="국기 이미지" class="max-w-[80vw] max-h-[30vh] sm:max-w-md sm:max-h-[45vh] object-contain drop-shadow-2xl">
                </div>
            </div>
            
            <!-- 하단 입력창 및 버튼 영역 (정답 확인 후 결과창이 떠도 깨지지 않도록 고정 프레임 적용) -->
            <div class="w-full shrink-0 flex flex-col items-center justify-end pb-2 sm:pb-6">
                <!-- 입력창 영역 -->
                <div id="input-area" class="w-full flex space-x-2 sm:space-x-3 items-center">
                    <input type="text" id="answer-input" placeholder="정답을 입력하세요" onkeydown="handleKeypress(event)"
                            class="flex-1 h-12 sm:h-14 px-4 bg-white rounded-xl text-center text-base sm:text-lg font-black text-slate-800 focus:outline-none shadow-lg focus:ring-4 focus:ring-blue-300">
                    <button onclick="checkAnswer()" class="bg-[#2C4682] hover:bg-violet-500 text-white font-bold h-12 w-12 sm:h-14 sm:w-14 rounded-xl transition-colors shadow-lg text-xl sm:text-2xl flex items-center justify-center shrink-0">
                        &gt;
                    </button>
                </div>
                
                <!-- 결과 표시 영역 (O/X 및 정답 텍스트) -->
                <div id="result-area" class="w-full hidden flex-col items-center justify-center space-y-1 sm:space-y-3 py-1">
                    <div id="result-status" class="text-base sm:text-xl font-bold flex items-center justify-center space-x-2"></div>
                    <div id="correct-answer-text" class="text-lg sm:text-3xl font-black text-white drop-shadow-md tracking-wider text-center break-keep"></div>
                    <button id="next-button" onclick="moveToNext()" class="bg-[#4369c6] hover:bg-violet-500 text-white font-bold h-12 sm:h-14 w-full rounded-xl transition-colors shadow-lg text-lg sm:text-xl flex justify-center items-center mt-1 focus:ring-4 ring-violet-300 ring-opacity-50">
                        다음 문제로 &gt;
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- [종료 화면] -->
    <div id="end-screen" class="hidden h-full w-full sm:h-auto max-w-md flex-col items-center justify-center p-4 text-white">
        <div class="w-full bg-[#4369C6] rounded-3xl shadow-2xl flex flex-col items-center p-8 sm:p-10 border border-white/10 text-center">
            <div class="text-6xl sm:text-7xl mb-4 sm:mb-6">🎉</div>
            <h2 class="text-2xl sm:text-3xl font-black mb-2 text-white">퀴즈 종료!</h2>
            <p class="text-sm sm:text-base text-gray-300 mb-6 sm:mb-8">모든 문제를 완료했습니다.</p>
            <div class="bg-black/20 w-full py-6 sm:py-8 rounded-2xl shadow-inner border border-white/5 mb-6 sm:mb-8 flex flex-col items-center">
                <p class="text-xs sm:text-sm text-gray-400 mb-1">최종 점수</p>
                <div class="flex items-end justify-center space-x-1">
                    <span id="final-score" class="text-5xl sm:text-6xl font-black text-yellow-400 drop-shadow-md">0</span>
                    <span class="text-gray-300 text-lg sm:text-xl font-bold mb-1">점</span>
                </div>
            </div>
            <button onclick="location.href='index.html'" class="w-full bg-[#4369c6] hover:bg-violet-500 text-white font-bold py-3 sm:py-4 rounded-xl transition-colors shadow-lg text-base sm:text-lg">
                메인 목록으로 돌아가기
            </button>
        </div>
    </div>

<!-- ⬇️ 데이터 파일 불러오기 -->
    <script src="data.js"></script>

    <script>
        let audioCtx = null;
        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        let gameQuizData = []; 
        let currentIndex = 0;  
        let score = 0;         
        let isAnswerSubmitted = false; 
        let isTimerEnabled = false;
        let timerInterval = null;
        let timeLeft = 10;

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function toggleTimerState(checked) { isTimerEnabled = checked; }

        function startQuiz() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();
            document.getElementById('quiz-modal').classList.add('hidden');
            gameQuizData = shuffleArray(quizDatabase.flags).slice(0, 20);
            currentIndex = 0;
            score = 0;
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            updateQuestionUI();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 10;
            document.getElementById('timer-sec').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-sec').innerText = timeLeft;
                if (timeLeft <= 5 && timeLeft > 0) playTickSound();
                if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeOut(); }
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function updateQuestionUI() {
            document.getElementById('question-number').innerText = `문제 ${currentIndex + 1} / ${gameQuizData.length}`;
            document.getElementById('quiz-image').src = gameQuizData[currentIndex].imageUrl;
            const inputArea = document.getElementById('input-area');
            const resultArea = document.getElementById('result-area');
            const inputElement = document.getElementById('answer-input');
            const timerBadge = document.getElementById('timer-badge');
            resultArea.classList.remove('flex'); resultArea.classList.add('hidden');
            inputArea.classList.remove('hidden'); inputArea.classList.add('flex');
            inputElement.value = "";
            setTimeout(() => { inputElement.focus(); }, 100);
            isAnswerSubmitted = false; 
            if (isTimerEnabled) { timerBadge.classList.remove('hidden'); startTimer(); } else { timerBadge.classList.add('hidden'); }
        }

        function handleKeypress(event) {
            if (event.isComposing || event.keyCode === 229) return;
            if (event.key === 'Enter') {
                event.preventDefault(); 
                if (!isAnswerSubmitted) checkAnswer(); else moveToNext();
            }
        }

        function handleTimeOut() {
            if (isAnswerSubmitted) return;
            isAnswerSubmitted = true;
            showResultUI(false, true);
        }

        function checkAnswer() {
            stopTimer();
            const inputElement = document.getElementById('answer-input');
            const userAnswer = inputElement.value.trim().replace(/\s+/g, ''); 
            if(!userAnswer) return;
            isAnswerSubmitted = true;
            const currentAnswers = gameQuizData[currentIndex].answers; 
            const isCorrect = currentAnswers.some(ans => ans.replace(/\s+/g, '') === userAnswer);
            showResultUI(isCorrect, false);
        }

        function showResultUI(isCorrect, isTimeOut = false) {
            const currentAnswers = gameQuizData[currentIndex].answers; 
            document.getElementById('input-area').classList.remove('flex');
            document.getElementById('input-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('result-area').classList.add('flex');
            const resultStatus = document.getElementById('result-status');
            if (isCorrect) {
                resultStatus.innerHTML = `<span class="bg-blue-500 text-white rounded-full w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center text-xs sm:text-sm font-black shadow-md">O</span> <span class="text-blue-400">정답!</span>`;
                score++;
            } else if (isTimeOut) {
                resultStatus.innerHTML = `<span class="bg-rose-500 text-white rounded-full w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center text-xs sm:text-sm font-black shadow-md">X</span> <span class="text-rose-400">시간 초과!</span>`;
            } else {
                resultStatus.innerHTML = `<span class="bg-rose-500 text-white rounded-full w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center text-xs sm:text-sm font-black shadow-md">X</span> <span class="text-rose-400">오답!</span>`;
            }
            document.getElementById('correct-answer-text').innerText = currentAnswers[0];
            setTimeout(() => { document.getElementById('next-button').focus(); }, 50);
        }

        function moveToNext() {
            stopTimer();
            currentIndex++;
            if (currentIndex < gameQuizData.length) updateQuestionUI();
            else {
                document.getElementById('game-screen').classList.remove('flex');
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('end-screen').classList.remove('hidden');
                document.getElementById('end-screen').classList.add('flex');
                document.getElementById('final-score').innerText = score;
            }
        }
    </script>
</body>
</html>
