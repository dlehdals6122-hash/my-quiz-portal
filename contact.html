<!DOCTYPE html>
<html lang="ko">
<head>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-4V0S1D9X1Y');

<!-- 브라우저 및 구글 검색 결과용 아이콘 -->
<link rel="icon" href="https://quizpang.net/favicon.png" type="image/png">

<!-- 모바일 바탕화면용 아이콘 -->
<link rel="apple-touch-icon" href="https://quizpang.net/favicon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>건의사항 - 퀴즈팡</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #4369C6;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="text-slate-800 min-h-[100dvh] flex flex-col">

    <!-- ⬇️ 공통 헤더가 들어갈 자리 -->
    <div id="header-container"></div>

    <!-- 건의사항 폼 컨테이너 (화면 중앙 유지) -->
    <div class="flex-1 flex items-center justify-center p-4 pb-10">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col">
            <!-- 상단 헤더 -->
            <div class="bg-slate-50 border-b border-slate-100 p-4 sm:p-5 flex justify-between items-center">
                <h2 class="text-lg sm:text-xl font-extrabold text-slate-800 flex items-center gap-2">
                    <span>💡</span> 건의사항 보내기
                </h2>
                <button type="button" onclick="location.href='index.html'" class="text-slate-400 hover:text-slate-600 font-bold p-1 transition-colors">
                    ✕ 닫기
                </button>
            </div>

            <!-- ⬇️ 입력 폼 영역 (form 태그로 묶음) -->
            <form id="contact-form" onsubmit="sendEmail(event)" class="p-5 sm:p-6 flex flex-col space-y-4">
                <p class="text-xs sm:text-sm text-slate-500 mb-2 leading-relaxed">
                    퀴즈팡을 이용하시면서 불편했던 점이나, 추가되었으면 하는 퀴즈 아이디어가 있다면 자유롭게 남겨주세요!
                </p>

                <!-- 제목 입력 -->
                <div>
                    <label for="mail-subject" class="block text-sm font-bold text-slate-700 mb-1.5">제목</label>
                    <input type="text" id="mail-subject" required placeholder="어떤 내용인지 간단히 적어주세요" 
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>

                <!-- 내용 입력 -->
                <div>
                    <label for="mail-body" class="block text-sm font-bold text-slate-700 mb-1.5">내용</label>
                    <textarea id="mail-body" required rows="6" placeholder="자세한 내용을 자유롭게 적어주세요.&#10;예) 애니메이션 OST 퀴즈도 만들어주세요!" 
                              class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm sm:text-base resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"></textarea>
                </div>

                <!-- 전송 버튼 -->
                <button type="submit" id="submit-btn" class="w-full mt-4 bg-[#4369C6] hover:bg-blue-700 text-white font-bold py-3.5 sm:py-4 rounded-xl transition-colors shadow-lg text-base sm:text-lg flex justify-center items-center gap-2">
                    <span>🚀</span> 담당자에게 바로 전송하기
                </button>
            </form>
        </div>
    </div>

    <script>
        async function sendEmail(event) {
            event.preventDefault(); 

            const button = document.getElementById('submit-btn');
            const subjectInput = document.getElementById('mail-subject').value.trim();
            const bodyInput = document.getElementById('mail-body').value.trim();

            const originalBtnHtml = button.innerHTML;
            button.innerHTML = '⏳ 전송 중...';
            button.disabled = true;
            button.classList.add('opacity-70');

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        // ⭐️ 여기에 발급받은 Access Key를 넣으세요! (안하셨다면 구글 폼처럼 안 넘어가니 유의하세요)
                        access_key: "여기에_발급받은_키를_넣으세요", 
                        
                        subject: "[퀴즈팡 건의사항] " + subjectInput,
                        name: "퀴즈팡 유저",
                        message: bodyInput
                    })
                });

                if (response.status === 200) {
                    alert("소중한 의견 감사합니다! 담당자에게 성공적으로 전송되었습니다. 🎉");
                    location.href = 'index.html'; 
                } else {
                    alert("앗, 전송에 실패했습니다. 잠시 후 다시 시도해 주세요.");
                }
            } catch (error) {
                console.error(error);
                alert("네트워크 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.");
            } finally {
                button.innerHTML = originalBtnHtml;
                button.disabled = false;
                button.classList.remove('opacity-70');
            }
        }
    </script>
    
    <!-- ⬇️ 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>
</body>
</html>
