<!DOCTYPE html>
<html lang="ko">
<head>

  gtag('config', 'G-4V0S1D9X1Y');

<!-- 브라우저 및 구글 검색 결과용 아이콘 -->
<link rel="icon" href="https://quizpang.net/favicon.png" type="image/png">

<!-- 모바일 바탕화면용 아이콘 -->
<link rel="apple-touch-icon" href="https://quizpang.net/favicon.png">

    <meta charset="UTF-8">
    <!-- 모바일 화면 줌 방지 및 크기 고정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영화 '오디세이' 인물 퀴즈</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #4369C6;
            /* 가로/세로 스크롤 원천 차단 */
            overflow: hidden; 
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <!-- 카카오 SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
</head>
<body class="text-slate-800 flex items-center justify-center p-0 w-full h-[100dvh] bg-[#4369C6] sm:p-4">

    <!-- [퀴즈 시작 / 설정 모달창] -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm h-[100dvh]">
        <div class="bg-white w-full max-w-[320px] sm:max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="bg-[#4369C6] p-3 sm:p-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base sm:text-lg">퀴즈 준비</h3>
                <!-- ⬇️ type="button" 추가 -->
                <button type="button" onclick="location.href='index.html'" class="text-indigo-200 hover:text-white text-2xl font-bold leading-none">&times;</button>
            </div>
            <div class="p-5 sm:p-6">
                <div class="text-center mb-4 sm:mb-5">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-2 sm:mb-3 shadow-inner overflow-hidden">
                        <img src="images/oddipics/oddithumb.png" alt="대표 아이콘" class="w-full h-full object-cover">
                    </div>
                    <h2 class="text-lg sm:text-xl font-extrabold text-slate-800">영화 '오디세이' 인물 퀴즈</h2>
                    <p class="text-slate-500 text-xs sm:text-sm mt-1">총 20문제가 출제됩니다.</p>
                </div>

                <label class="bg-slate-50 border border-slate-200 rounded-xl p-3 sm:p-4 mb-5 flex items-center justify-between cursor-pointer select-none">
                    <div class="flex items-center space-x-2">
                        <span class="text-lg sm:text-xl">⏱️</span>
                        <div>
                            <div class="font-bold text-slate-800 text-xs sm:text-sm">[난이도 Up!]타이머 설정</div>
                            <div class="text-[11px] text-slate-500">문제당 제한시간 10초</div>
                        </div>
                    </div>
                    
                    <div class="relative inline-flex items-center">
                        <input type="checkbox" id="timer-toggle" class="opacity-0 absolute w-0 h-0 peer" onchange="toggleTimerState(this.checked)">
                        <div class="w-12 h-6 sm:w-14 sm:h-7 bg-slate-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 sm:after:h-6 sm:after:w-6 after:transition-all peer-checked:bg-[#4369C6]"></div>
                    </div>
                </label>

                <!-- ⬇️ type="button" 추가 -->
                <button type="button" onclick="startQuiz()" class="w-full bg-[#4369c6] hover:bg-violet-600 text-white font-extrabold py-3.5 sm:py-4 rounded-xl transition-all shadow-lg text-base sm:text-lg">
                    게임 시작하기
                </button>
            </div>
        </div>
    </div>

    <!-- [게임 화면] -->
    <div id="game-screen" class="hidden w-full h-full sm:h-auto sm:max-w-md flex-col items-center justify-center p-0">
        <div class="w-full h-full sm:h-auto bg-[#4369C6] flex-1 sm:flex-none sm:min-h-[600px] sm:rounded-3xl sm:shadow-2xl overflow-hidden relative flex flex-col p-4 sm:p-6 border-white/10 sm:border">
            
            <!-- 상단 바 -->
            <div class="flex justify-between items-center mb-4 sm:mb-8 shrink-0">
                <!-- ⬇️ type="button" 추가 -->
                <button type="button" onclick="location.href='index.html'" class="text-gray-300 hover:text-white font-bold px-2 py-1 rounded-lg hover:bg-white/10 transition-colors text-xs sm:text-sm flex items-center gap-1">
                    ← 메인으로
                </button>
                <div class="flex items-center space-x-2">
                    <div id="timer-badge" class="hidden bg-rose-500/90 text-white px-2.5 py-1 rounded-full font-bold text-xs sm:text-sm shadow-md animate-pulse">
                        ⏱️ <span id="timer-sec">10</span>초
                    </div>
                    <div class="bg-black/30 text-white px-3 sm:px-4 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm shadow-inner border border-white/5">
                        <span id="question-number">문제 1 / 20</span>
                    </div>
                </div>
            </div>

            <!-- 중앙 이미지 영역 -->
            <div class="flex-1 flex flex-col items-center justify-center mb-4 sm:mb-8 w-full relative min-h-0">
                <div class="absolute inset-0 bg-blue-500/10 blur-2xl sm:blur-3xl rounded-full"></div>
                
                <div class="w-[260px] sm:w-[340px] aspect-square bg-slate-100 rounded-2xl shadow-xl border border-white/20 relative flex items-center justify-center z-10 overflow-hidden shrink-0 transition-all">
                    <img id="quiz-image" src="" alt="오디세이 이미지" class="w-full h-full object-cover object-center transition-all duration-300 block">
                    <img id="result-full-image" src="" alt="정답 풀샷" class="hidden w-1/2 h-full object-contain bg-black/40 transition-all duration-300">
                </div>
            </div>
            
            <!-- 하단 입력창 및 버튼 영역 (중복 제거 완료) -->
            <div class="w-full shrink-0 flex flex-col items-center justify-end pb-2 sm:pb-4 min-h-[80px]">
                <div id="input-area" class="w-full flex space-x-2 sm:space-x-3 items-center">
                    <input type="text" id="answer-input" placeholder="정답을 입력하세요" autocomplete="off" onkeydown="handleKeypress(event)"
                            class="flex-1 min-w-0 h-12 sm:h-14 px-3 sm:px-4 bg-white rounded-xl text-center text-base sm:text-lg font-black text-slate-800 focus:outline-none shadow-lg focus:ring-4 focus:ring-blue-300">
                    <button type="button" onclick="checkAnswer()" class="bg-[#2C4682] hover:bg-violet-500 text-white font-bold h-12 w-12 sm:h-14 sm:w-14 rounded-xl transition-colors shadow-lg text-xl sm:text-2xl flex items-center justify-center shrink-0">
                        &gt;
                    </button>
                </div>
                
                <div id="result-area" class="w-full hidden flex-col items-center justify-center space-y-2 sm:space-y-4">
                    <div id="result-status" class="text-lg sm:text-xl font-bold flex items-center justify-center space-x-2"></div>
                    <div id="correct-answer-text" class="text-xl sm:text-3xl font-black text-white drop-shadow-md tracking-wider text-center break-keep w-full overflow-hidden whitespace-normal px-2"></div>
                    <button type="button" id="next-button" onclick="moveToNext()" class="bg-[#2C4682] hover:bg-violet-500 text-white font-bold h-12 sm:h-14 w-full rounded-xl transition-colors shadow-lg text-lg sm:text-xl flex justify-center items-center mt-2 focus:ring-4 ring-violet-300 ring-opacity-50 shrink-0">
                        다음 문제로 &gt;
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- [종료 화면] -->
    <div id="end-screen" class="hidden h-full w-full sm:h-auto max-w-md flex-col items-center justify-center p-4 text-white">
        <div class="w-full h-full sm:h-auto bg-[#4369C6] sm:rounded-3xl shadow-2xl flex flex-col items-center p-8 sm:p-10 sm:border border-white/10 text-center justify-center">
            <div class="text-6xl sm:text-7xl mb-4 sm:mb-6">🎉</div>
            <h2 class="text-2xl sm:text-3xl font-black mb-2 text-white">퀴즈 종료!</h2>
            <p class="text-sm sm:text-base text-gray-300 mb-6 sm:mb-8">모든 문제를 완료했습니다.</p>
            <div class="bg-black/20 w-full py-6 sm:py-8 rounded-2xl shadow-inner border border-white/5 mb-6 sm:mb-8 flex flex-col items-center">
                <p class="text-xs sm:text-sm text-gray-400 mb-1">최종 점수</p>
                <div class="flex items-end justify-center space-x-1">
                    <span id="final-score" class="text-5xl sm:text-6xl font-black text-yellow-400 drop-shadow-md">0</span>
                    <span class="text-gray-300 text-lg sm:text-xl font-bold mb-1">점</span>
                </div>
            </div>
            
            <!-- ⬇️ type="button" 추가 -->
            <button type="button" onclick="resetQuiz()" class="w-full bg-white border-2 border-[#4369c6] text-[#4369c6] hover:bg-[#4369c6] hover:text-white font-bold py-3 sm:py-4 rounded-xl transition-all shadow-sm text-base sm:text-lg mb-3">
                🔄 다시하기
            </button>
            <button type="button" onclick="shareKakao()" class="w-full bg-[#FEE500] hover:bg-[#D6C700] text-[#371D1E] font-bold py-3 sm:py-4 rounded-xl transition-all shadow-lg text-base sm:text-lg mb-3 flex items-center justify-center space-x-2">
                <span>💬 카카오톡으로 결과 공유하기</span>
            </button>
            <button type="button" onclick="location.href='index.html'" class="w-full bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 sm:py-4 rounded-xl transition-all shadow-lg text-base sm:text-lg">
                🏠 메인으로
            </button>
        </div>
    </div>

    <!-- ⬇️ 데이터 파일 불러오기 -->
    <script src="data.js"></script>

    <!-- ⬇️ [핵심] 이 게임만의 고유 설정값 정의 -->
    <script>
        const CURRENT_QUIZ_DATA = quizDatabase.oddipics;
        const QUIZ_TITLE = "영화 '오디세이' 인물 퀴즈";
    </script>

    <!-- ⬇️ 공통 퀴즈 엔진 -->
    <script src="common.js"></script>
    <script src="header.js"></script>
</body>
</html>
